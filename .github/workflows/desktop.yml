name: Build Windows

# 触发条件：推送到 main / master、打 tag、PR，以及手动触发
on:
  workflow_dispatch:
    inputs:
      flutter_channel:
        description: "Flutter channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta

env:
  FLUTTER_VERSION: "3.24.0" # 按需与 pubspec.yaml 中的最低版本对齐，可改为具体版本号

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: desktop
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Strip unused VLC plugins
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/strip_vlc_plugins.ps1

      - name: Locate build output
        id: locate
        shell: powershell
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "Release directory not found: $releaseDir"
            exit 1
          }
          $resolved = (Resolve-Path $releaseDir).Path
          Write-Host "Release directory: $resolved"
          echo "release_dir=$resolved" >> $env:GITHUB_OUTPUT

      - name: Package artifact (zip)
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "dev" }
          $zipName = "mytv_desktop-windows-$version.zip"
          Compress-Archive -Path "${{ steps.locate.outputs.release_dir }}\*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mytv_desktop-windows
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
