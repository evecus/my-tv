name: build tv

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.4)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: tv
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PIS_SO_BUILD=false

      # ── 解码 keystore ─────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > /tmp/release.jks

      # ── 并行签名全部 APK（V2/V3，跳过 V1）────────────────────────
      - name: Sign all APKs
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          OUTDIR=app/build/outputs/apk/release
          KEYSTORE=/tmp/release.jks

          sign_apk() {
            local INPUT="$1"
            local OUTPUT="${INPUT%.apk}-signed.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT" "${INPUT%.apk}-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "${{ secrets.ALIAS }}" \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.ALIAS_PASSWORD }}" \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$OUTPUT" \
              "${INPUT%.apk}-aligned.apk"
            echo "Signed: $OUTPUT"
          }

          export -f sign_apk
          export BUILD_TOOLS KEYSTORE
          export ALIAS="${{ secrets.ALIAS }}"
          export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          export ALIAS_PASSWORD="${{ secrets.ALIAS_PASSWORD }}"

          # 并行签名 4 个 APK
          parallel sign_apk ::: \
            "$OUTDIR"/mytv-*-arm64-v8a.apk \
            "$OUTDIR"/mytv-*-armeabi-v7a.apk

      # ── 找到签名后的文件路径 ──────────────────────────────────────
      - name: Locate signed APKs
        id: locate
        run: |
          OUTDIR=app/build/outputs/apk/release
          ARM64=$(ls $OUTDIR/*arm64-v8a*-signed.apk 2>/dev/null | head -1)
          ARM32=$(ls $OUTDIR/*armeabi-v7a*-signed.apk 2>/dev/null | head -1)
          echo "arm64=$ARM64"   >> $GITHUB_OUTPUT
          echo "arm32=$ARM32"   >> $GITHUB_OUTPUT
          echo "arm64: $ARM64 | arm32: $ARM32"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: my-tv ${{ github.event.inputs.tag }}
          prerelease: false
          files: app/build/outputs/apk/release/*signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
